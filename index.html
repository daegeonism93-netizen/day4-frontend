<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>전국 날씨·미세먼지 3D 지도</title>
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="scene"></div>
  <div id="loading" class="loading">3D 지형 불러오는 중…</div>

  <aside class="panel">
    <div class="title">
      <h1>전국 날씨 · 미세먼지 3D</h1>
      <button id="toggle" type="button" class="ghost" aria-expanded="true" aria-label="상세 정보 접기/펼치기">▾</button>
    </div>

    <div class="controls">
      <div class="search">
        <input id="q" type="text" autocomplete="off" placeholder="지역 검색 (예: 강, ㄱㄹ, Gangneung)"
               role="combobox" aria-expanded="false" aria-controls="suggest" aria-label="지역 검색" />
        <ul id="suggest" class="suggest" role="listbox" hidden></ul>
      </div>
      <button id="refresh" type="button">새로고침</button>
    </div>

    <p id="status" class="status">지도에서 지역을 클릭하거나 검색하세요.</p>

    <section id="weather" class="weather" hidden>
      <div class="head">
        <div class="icon" id="icon"></div>
        <div>
          <div class="temp"><span id="temp"></span>°C</div>
          <div class="desc" id="desc"></div>
          <div class="region" id="region"></div>
        </div>
      </div>
      <dl class="details">
        <div><dt>체감온도</dt><dd id="feels"></dd></div>
        <div><dt>습도</dt><dd id="humidity"></dd></div>
        <div><dt>풍속</dt><dd id="wind"></dd></div>
        <div><dt>강수량</dt><dd id="precip"></dd></div>
        <div><dt>미세먼지 PM10</dt><dd id="pm10"></dd></div>
        <div><dt>초미세먼지 PM2.5</dt><dd id="pm25"></dd></div>
      </dl>
      <p class="updated">업데이트 <span id="time"></span><br />미세먼지는 대기질 모델(CAMS) 예측값이며 측정소 실측값과 다를 수 있어요.</p>
    </section>
  </aside>

  <div class="layers" role="radiogroup" aria-label="지도 표시 항목">
    <button type="button" data-layer="pm10" class="on">미세먼지</button>
    <button type="button" data-layer="pm25">초미세먼지</button>
    <button type="button" data-layer="temp">기온</button>
  </div>
  <div class="legend" id="legend"></div>
  <div class="hint">드래그 회전 · 휠 확대 · 우클릭 드래그 이동 · 막대 높이 = 수치</div>
  <div class="attrib">
    지도 © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> ·
    지형 <a href="https://registry.opendata.aws/terrain-tiles/" target="_blank" rel="noopener">Terrain Tiles</a> ·
    <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a>
  </div>

  <script src="cities.js"></script>
  <script src="search.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
