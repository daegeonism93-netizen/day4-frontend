<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>전국 날씨·미세먼지 지도</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="chat.css" />
</head>
<body>
  <div id="map"></div>

  <aside class="panel">
    <h1>전국 날씨 · 미세먼지</h1>

    <div class="controls">
      <div class="search">
        <input id="q" type="text" autocomplete="off" placeholder="지역 검색 (예: 강, ㄱㄹ, Gangneung)"
               role="combobox" aria-expanded="false" aria-controls="suggest" aria-label="지역 검색" />
        <ul id="suggest" class="suggest" role="listbox" hidden></ul>
      </div>
      <button id="refresh" type="button">새로고침</button>
    </div>

    <p id="status" class="status">지도에서 지역을 클릭하거나 검색하세요.</p>

    <section id="weather" class="weather" hidden>
      <div class="head">
        <div class="icon" id="icon"></div>
        <div>
          <div class="temp"><span id="temp"></span>°C</div>
          <div class="desc" id="desc"></div>
          <div class="region" id="region"></div>
        </div>
      </div>
      <dl class="details">
        <div><dt>체감온도</dt><dd id="feels"></dd></div>
        <div><dt>습도</dt><dd id="humidity"></dd></div>
        <div><dt>풍속</dt><dd id="wind"></dd></div>
        <div><dt>강수량</dt><dd id="precip"></dd></div>
        <div><dt>미세먼지 PM10</dt><dd id="pm10"></dd></div>
        <div><dt>초미세먼지 PM2.5</dt><dd id="pm25"></dd></div>
      </dl>
      <p class="updated">업데이트 <span id="time"></span><br />미세먼지는 대기질 모델(CAMS) 예측값이며 측정소 실측값과 다를 수 있어요.</p>
    </section>
  </aside>

  <div class="layers" role="radiogroup" aria-label="지도 표시 항목">
    <button type="button" data-layer="pm10" class="on">미세먼지</button>
    <button type="button" data-layer="pm25">초미세먼지</button>
    <button type="button" data-layer="temp">기온</button>
  </div>
  <div class="legend" id="legend"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <button id="chatFab" type="button" class="chat-fab">💬 AI 추천</button>
  <section id="chat" class="chat" aria-label="AI 여행 추천">
    <header>AI 여행 추천 <small>Gemini · 날씨 + 장소 검색</small></header>
    <div id="chatLog" class="chat-log" aria-live="polite"></div>
    <div id="chatHints" class="chat-hints"></div>
    <form id="chatForm">
      <input id="chatInput" type="text" maxlength="500" autocomplete="off" placeholder="예: 이번 주말 속초 어디 가지?" aria-label="질문 입력" />
      <button id="chatSend" type="submit">전송</button>
    </form>
  </section>

  <script src="cities.js"></script>
  <script src="search.js"></script>
  <script src="app.js"></script>
  <script src="chat.js"></script>
</body>
</html>
